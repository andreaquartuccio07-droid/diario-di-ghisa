<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/">
<title>Tavola delle figure</title>
<style id="tavola">
/* Tavola di controllo delle figure: non fa parte dell'app e non va in GUSCIO.
   Legge stile, pose e funzioni da index.html, cosi' mostra sempre le figure vere.
   Si apre con: node anteprima.mjs 5188  ->  http://localhost:5188/.claude/skills/figura-esercizio/tavola.html
   (?tema=dark per il tema scuro) */
html{scrollbar-width:none}
body{padding:14px}
h1{margin-bottom:4px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-top:12px}
.mov{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mov .fila{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mov figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-2)}
.mov .fig{width:100%;height:auto}
.errore{color:var(--down);font-weight:600}
</style>
</head>
<body>
<h1>Tavola delle figure</h1>
<div class="small muted" id="nota"></div>
<div class="griglia" id="griglia"></div>
<script>
(async () => {
const q = new URLSearchParams(location.search);
if (q.get("tema")) document.documentElement.dataset.theme = q.get("tema");
const sorgente = await (await fetch("/index.html", {cache: "no-store"})).text();
const st = document.createElement("style");
st.textContent = sorgente.match(/<style>([\s\S]*?)<\/style>/)[1];
document.head.insertBefore(st, document.getElementById("tavola"));

// i pezzi di index.html che servono: le pose e le funzioni che le disegnano
const pezzo = (da, a) => { const i = sorgente.indexOf(da), j = sorgente.indexOf(a, i); if (i < 0 || j < 0) throw new Error("In index.html non trovo: " + (i < 0 ? da : a)); return sorgente.slice(i, j); };
const codice = pezzo("const PAVIMENTO", "// Dal nome al movimento") + pezzo("const TEMPI_FIGURA", "// Con \"riduci movimento\"");
const {MOV, posaFigura} = new Function(codice + "; return {MOV, posaFigura};")();

const svg = (m, dentro) => '<svg class="fig" viewBox="0 0 64 64">' + m.fissi.map(f => '<polyline class="fisso" points="' + f + '"/>').join("") + dentro + '</svg>';
const punti = p => p.trim().split(/\s+/).length;
let html = "", guasti = 0;
Object.keys(MOV).forEach(k => {
  const m = MOV[k];
  const diverse = m.linee.concat(m.cavi || []).filter(l => punti(l[0]) !== punti(l[1])).length;
  guasti += diverse;
  html += '<div class="card mov"><div class="spread"><h3>' + m.nome + '</h3><span class="tiny muted mono">' + k + '</span></div>' +
    (diverse ? '<div class="errore">' + diverse + ' linee con un numero di punti diverso fra le due pose: l\'animazione non parte.</div>' : "") +
    '<div class="fila">' +
      '<figure>' + svg(m, posaFigura(m, 0)) + 'partenza</figure>' +
      '<figure>' + svg(m, posaFigura(m, 1)) + 'arrivo</figure>' +
      '<figure>' + svg(m, '<g class="ombra">' + posaFigura(m, 1) + '</g>' + posaFigura(m, 0)) + 'ferma</figure>' +
      '<figure>' + svg(m, posaFigura(m, -1)) + 'in movimento</figure>' +
    '</div></div>';
});
document.getElementById("griglia").innerHTML = html;
document.getElementById("nota").textContent = Object.keys(MOV).length + " movimenti. " + (guasti ? "ATTENZIONE: " + guasti + " linee da sistemare." : "Tutte le pose hanno lo stesso numero di punti.");
document.body.dataset.pronto = "1";
})().catch(e => { document.getElementById("nota").textContent = String(e.message || e); document.getElementById("nota").className = "errore"; document.body.dataset.pronto = "1"; });
</script>
</body>
</html>
