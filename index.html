<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario di Ghisa</title>
<meta name="description" content="Scheda della palestra, log delle serie e carichi progressivi.">
<meta name="theme-color" content="#A9E9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B3A48" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>
/* Font in locale (sottoinsieme latino): cosi' ci sono anche senza campo. Plex Sans e' variabile. */
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 600;font-stretch:100%;font-display:swap;src:url(fonts/ibm-plex-sans.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-500.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Stile "Abisso": fondo chiaro con una fascia di luce ciano in alto, riquadri di vetro chiaro,
   e cio' che conta (obiettivo, timer, menu in basso) in vetro scuro. Vedi la skill stile-ghisa. */
:root{
  --f-tit:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --bg:#F1F5F6; --surface:#FFFFFF; --surface-2:#E3EAED; --surface-3:#F6F9FA;
  --glass:rgba(255,255,255,.8); --edge:#FFFFFF;
  --ink:#06202B; --ink-2:#3E5560; --ink-3:#5E747E;
  --line:#D9E2E6; --line-2:#C2CFD5;
  --accent:#19D3F3; --accent-soft:rgba(25,211,243,.16); --accent-ink:#00697F; --on-accent:#03202A;
  --up:#0B7A54; --up-soft:rgba(11,122,84,.11); --on-up:#FFFFFF; --down:#B0402C;
  --vol:#D5E0E5; --dato:#008CA6;
  --deep:rgba(5,30,41,.9); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
  --aurora-top:#A9E9F6; --aurora-2:rgba(40,150,220,.3);
  --shadow:0 6px 22px rgba(6,32,43,.1); --shadow-alta:0 20px 60px rgba(6,32,43,.3); --scrim:rgba(4,20,27,.5);
  --r:20px;
  --p-rosso:#C1272D; --p-blu:#1B4F9C; --p-verde:#2A7F52; --p-giallo:#C08A06; --p-nero:#4E555B; --p-acciaio:#8A939B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#040B0E; --surface:#101C22; --surface-2:#1B2A32; --surface-3:#16242B;
    --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.13);
    --ink:#E8F6FA; --ink-2:#A3BEC8; --ink-3:#7C98A3;
    --line:#1F2E36; --line-2:#2D3F48;
    --accent:#2BD9F5; --accent-soft:rgba(43,217,245,.15); --accent-ink:#5FE3F8; --on-accent:#03181E;
    --up:#4FD69A; --up-soft:rgba(79,214,154,.14); --on-up:#03181E; --down:#E2705C;
    --vol:#22323A; --dato:#2BD9F5;
    --deep:rgba(20,60,74,.74); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
    --aurora-top:#0B3A48; --aurora-2:rgba(30,100,170,.24);
    --shadow:0 6px 22px rgba(0,0,0,.45); --shadow-alta:0 20px 60px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
    --p-rosso:#E0574F; --p-blu:#5B92E0; --p-verde:#48B27C; --p-giallo:#F0B838; --p-nero:#98A2AA; --p-acciaio:#C3CBD2;
  }
}
:root[data-theme="dark"]{
  --bg:#040B0E; --surface:#101C22; --surface-2:#1B2A32; --surface-3:#16242B;
  --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.13);
  --ink:#E8F6FA; --ink-2:#A3BEC8; --ink-3:#7C98A3;
  --line:#1F2E36; --line-2:#2D3F48;
  --accent:#2BD9F5; --accent-soft:rgba(43,217,245,.15); --accent-ink:#5FE3F8; --on-accent:#03181E;
  --up:#4FD69A; --up-soft:rgba(79,214,154,.14); --on-up:#03181E; --down:#E2705C;
  --vol:#22323A; --dato:#2BD9F5;
  --deep:rgba(20,60,74,.74); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
  --aurora-top:#0B3A48; --aurora-2:rgba(30,100,170,.24);
  --shadow:0 6px 22px rgba(0,0,0,.45); --shadow-alta:0 20px 60px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  --p-rosso:#E0574F; --p-blu:#5B92E0; --p-verde:#48B27C; --p-giallo:#F0B838; --p-nero:#98A2AA; --p-acciaio:#C3CBD2;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
/* La luce in alto e' un livello fisso dietro a tutto: non si ridisegna scorrendo. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(280px 150px at 6% 170px,var(--aurora-2),transparent 100%),
  linear-gradient(180deg,var(--aurora-top),transparent 360px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.wrap{max-width:760px;margin:0 auto;padding:0 13px}
header.top{position:sticky;top:0;z-index:40;background:var(--aurora-top);background:linear-gradient(180deg,var(--aurora-top) 30%,color-mix(in srgb,var(--aurora-top) 72%,transparent));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.top-in{display:flex;align-items:center;gap:9px;height:54px}
.brand{font-family:var(--f-tit);font-weight:700;font-size:19px;letter-spacing:.03em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .bar{width:22px;height:8px;border-radius:4px;background:var(--accent-ink)}
.chip-sync{font-size:11.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--edge);border-radius:100px;padding:3px 9px;background:var(--glass);white-space:nowrap}
.chip-sync::first-letter{text-transform:uppercase}
.chip-sync[data-on="1"]{color:var(--up);border-color:color-mix(in srgb,var(--up) 35%,var(--line))}
.menu{position:relative}
.menu>summary{list-style:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--edge);background:var(--glass)}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-alta);padding:6px;min-width:232px;z-index:50}
.menu-pop button{display:block;width:100%;min-height:44px;text-align:left;background:none;border:0;padding:9px 11px;border-radius:11px;font-size:14.5px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 2px}

main{padding:15px 0 calc(130px + env(safe-area-inset-bottom) + var(--timer-h,0px))}
/* Barra in basso: una pillola di vetro scuro staccata dai bordi. Con il margine occupa 64px, il timer parte da 72. */
nav.tabs{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));z-index:45;max-width:740px;margin:0 auto;background:var(--deep);border:1px solid var(--deep-fill);border-radius:22px;padding:4px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tab{background:none;border:0;min-height:48px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--deep-ink-2);font-size:11.5px;font-weight:600;border-radius:17px;position:relative;transition:background-color .15s ease-out}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--deep-ink);background:var(--deep-fill)}
.tab[aria-selected="true"] svg{color:var(--glow)}
.tab .pallino{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media(min-width:760px){
  nav.tabs{position:sticky;top:54px;bottom:auto;left:auto;right:auto;max-width:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;background:color-mix(in srgb,var(--aurora-top) 72%,transparent);box-shadow:none;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .tabs-in{grid-template-columns:repeat(4,max-content);gap:2px}
  .tab{flex-direction:row;gap:7px;padding:10px 15px;border-radius:0;color:var(--ink-3);font-size:13px;border-bottom:2px solid transparent}
  .tab[aria-selected="true"]{color:var(--ink);background:none;border-bottom-color:var(--dato)}
  .tab[aria-selected="true"] svg{color:var(--accent-ink)}
  .tab .pallino{top:8px;right:4px}
  main{padding-bottom:calc(40px + var(--timer-h,0px))}
}

.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-weight:600;font-size:12.5px;color:var(--ink-2)}
.eyebrow::first-letter{text-transform:uppercase}
h1,h2,h3{font-family:var(--f-tit);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:32px;font-weight:700;line-height:1.1}
h2{font-size:23px;font-weight:700;line-height:1.15}
h3{font-size:20px;font-weight:700;line-height:1.2}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:14px;min-height:44px;padding:9px 14px;font-weight:600;font-size:14px;transition:background-color .15s ease-out,transform .15s ease-out}
.btn:hover{background:var(--surface-2)}
.btn:active,.tick:active,.gday:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-tit);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1.2;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.icobtn{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--ink-2)}
.icobtn:hover{color:var(--ink);background:var(--surface-2)}
.icobtn svg{width:16px;height:16px}

.gruppo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.gruppo::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g,var(--p-acciaio));flex:0 0 auto}

/* blocco */
.blocco{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.barra{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.barra i{display:block;background:var(--dato);height:100%}
.sett{display:flex;gap:5px}
.sett b{flex:1;height:28px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink-2)}
.sett b[data-st="fatta"]{background:var(--accent-soft);color:var(--accent-ink)}
.sett b[data-st="ora"]{background:var(--accent);color:var(--on-accent)}

.giorni{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.giorni::-webkit-scrollbar{display:none}
.gday{flex:0 0 auto;border:1px solid var(--edge);background:var(--glass);border-radius:16px;padding:8px 14px;text-align:left;min-width:122px;min-height:56px;transition:background-color .15s ease-out,transform .15s ease-out}
.gday b{display:block;font-family:var(--f-tit);font-size:19px;font-weight:700;line-height:1.2}
.gday span{font-size:11.5px;color:var(--ink-3)}
.gday[aria-pressed="true"]{border-color:transparent;background:var(--deep);color:var(--deep-ink)}
.gday[aria-pressed="true"] span{color:var(--deep-ink-2)}

.sezione{display:flex;align-items:center;gap:10px;margin-top:4px}
.sezione::after{content:"";flex:1;height:1px;background:var(--line)}

.es{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.es.ss{border-left:3px solid var(--dato)}
.es-head{padding:14px 14px 6px;display:flex;flex-direction:column;gap:7px}
.es-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.es-title h3{font-size:22px;line-height:1.15}
.prescr{font-family:var(--f-num);font-size:17px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.meta-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.tec{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:3px 8px}
/* Obiettivo: il riquadro scuro dentro la card, il numero da leggere prima di caricare il bilanciere */
.obiettivo{display:flex;align-items:baseline;gap:10px;align-self:stretch;background:var(--deep);border-radius:14px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--glow)}
.obiettivo .mono{font-family:var(--f-num);font-size:23px;font-weight:700;line-height:1.1;color:var(--deep-ink)}
.motivo{font-size:12px;color:var(--ink-3)}
.nota-es{font-size:12px;color:var(--ink-3);font-style:italic}

.serie{padding:2px 12px 6px}
.sr{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;padding:4px 0}
.sr-n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--ink-3);text-align:center}
.sr[data-att="1"] .sr-n{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.fld{position:relative}
.fld input{width:100%;height:50px;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:0 26px 0 8px;text-align:center;font-family:var(--f-num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;transition:background-color .15s ease-out}
.fld input:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3);text-decoration:none;pointer-events:none}
.tick{width:52px;height:50px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);transition:background-color .15s ease-out,transform .15s ease-out}
.tick svg{width:21px;height:21px}
.sr[data-done="1"] .tick{background:var(--up);border-color:var(--up);color:var(--on-up)}
.sr[data-done="1"] input{background:var(--up-soft);border-color:transparent}
.sr[data-done="1"] .fld u{color:var(--ink-2)}
/* telefoni stretti: meno margini, cosi' un carico come 102,5 sta intero nel campo */
@media(max-width:360px){
  .serie{padding-left:8px;padding-right:8px}
  .sr{grid-template-columns:24px 1fr 1fr 50px;gap:6px}
  .fld input{font-size:22px;padding:0 22px 0 4px}
  .fld u{right:6px;font-size:10.5px}
  .tick{width:50px}
}
.serie-az{display:flex;gap:6px;padding:0 10px 10px;align-items:center}
.serie-az .btn{min-height:48px;padding-left:14px;padding-right:14px}

.note-box{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:11px 12px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;font-weight:400;line-height:1.5;color:var(--ink);text-transform:none;letter-spacing:0;resize:vertical;min-height:70px}
/* --timer-h: altezza del timer di recupero quando e' a schermo (la imposta avviaTimer), cosi' Salva gli sta sopra */
.salva-bar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom) + var(--timer-h,0px));z-index:30;padding-top:6px}
.salva-bar .btn{min-height:52px;border-radius:17px}
.salva-bar .btn:disabled{opacity:1;background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2)}
@media(min-width:760px){.salva-bar{bottom:calc(16px + var(--timer-h,0px))}}

.timer{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(72px + env(safe-area-inset-bottom));z-index:46;max-width:740px;margin:0 auto;background:var(--deep);color:var(--deep-ink);border:1px solid var(--deep-fill);border-radius:20px;padding:6px 6px 6px 15px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);overflow:hidden;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
@media(min-width:760px){.timer{bottom:16px}}
.timer .t{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--glow)}
.timer .lbl{font-size:12.5px;color:var(--deep-ink-2);margin-right:auto;line-height:1.25}
.timer .lbl::first-letter{text-transform:uppercase}
.timer button{background:var(--deep-fill);border:0;color:inherit;border-radius:14px;min-height:48px;padding:6px 13px;font-size:14px;font-weight:600}
.timer .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 3px 3px 0;transition:width .95s linear}

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const app = $("#app");
const REV = 2;

/* ============ utilità ============ */
const GRUPPI = [
  {id:"petto",   nome:"Petto",   col:"var(--p-rosso)"},
  {id:"dorso",   nome:"Dorso",   col:"var(--p-blu)"},
  {id:"gambe",   nome:"Gambe",   col:"var(--p-verde)"},
  {id:"spalle",  nome:"Spalle",  col:"var(--p-giallo)"},
  {id:"braccia", nome:"Braccia", col:"var(--p-nero)"},
  {id:"core",    nome:"Core",    col:"var(--p-acciaio)"},
];
const gruppo = id => GRUPPI.find(g => g.id === id) || GRUPPI[5];

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
function isoData(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const oggiISO = () => isoData(new Date());
const dataBreve = iso => { const p = String(iso).split("-"); return p[2] + "/" + p[1]; };
function dataLunga(iso){ return new Date(iso + "T12:00:00").toLocaleDateString("it-IT", {weekday:"short", day:"numeric", month:"short"}); }
function dataIT(iso){ return new Date(iso + "T12:00:00").toLocaleDateString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric"}); }
function piuGiorni(iso, n){ const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoData(d); }
function giorniTra(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000); }
const giorniFa = iso => giorniTra(iso, oggiISO());
const nSedute = n => n + (n === 1 ? " seduta" : " sedute");
const num = (n, d=1) => String(Math.round(n * 10**d) / 10**d).replace(".", ",");
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const segno = n => (n > 0 ? "+" : n < 0 ? "−" : "") + num(Math.abs(n), 1);
const arrotonda = (v, passo) => Math.max(passo, Math.round(v / passo) * passo);
const e1rm = (kg, reps) => kg > 0 && reps > 0 ? kg * (1 + reps / 30) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chiave = nome => String(nome).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

/* ============ la scheda del coach ============ */
/* Recuperi: 1:30 fra le serie; in superserie nessuna pausa dopo il primo esercizio e 2:30 dopo l'ultimo.
   Si applica una volta sola a ogni scheda (scheda.recuperi = 2); poi i valori restano modificabili da Scheda. */
function sistemaRecuperi(scheda){
  if (!scheda || !Array.isArray(scheda.giorni) || scheda.recuperi >= 2) return scheda;
  scheda.giorni.forEach(g => (g.esercizi || []).forEach((e, i) => {
    const prima = g.esercizi[i - 1], dopo = g.esercizi[i + 1];
    e.recupero = e.superset && dopo ? 0 : (prima && prima.superset ? 150 : 90);
  }));
  scheda.recuperi = 2;
  return scheda;
}
function schedaCoach(){
  const e = o => Object.assign({id: uid(), gruppo:"petto", att:0, serie:4, repMin:8, repMax:8, repsTxt:"", recupero:90, incremento:2.5, tecnica:"", nota:"", superset:false, sezione:"main"}, o);
  const ADDOME = [
    e({nome:"Crunch al cavo", gruppo:"core", serie:3, repMin:6, repMax:8, repsTxt:"8-6", incremento:2.5, sezione:"post"}),
    e({nome:"Ab wheel (con elastico se riesci)", gruppo:"core", serie:3, repMin:8, repMax:10, repsTxt:"10-8", incremento:1.25, sezione:"post"}),
  ];
  const POLPACCI = [
    e({nome:"Calf alla pressa orizzontale", gruppo:"gambe", serie:3, repMin:12, repMax:12, repsTxt:"12", incremento:5, sezione:"post"}),
    e({nome:"Calf seduto (macchinario)", gruppo:"gambe", serie:3, repMin:6, repMax:8, repsTxt:"8-6", incremento:2.5, sezione:"post"}),
  ];
  const g = (nome, tipo, post, esercizi) => ({
    id: uid(), nome, tipo, post,
    esercizi: esercizi.concat((post === "addome" ? ADDOME : POLPACCI).map(x => Object.assign({}, x, {id: uid()}))),
  });
  return sistemaRecuperi({
    rev: REV,
    nome: "Scheda Andrea 7.0",
    sottotitolo: "7° blocco — 3 full body + 1 seduta focus petto/dorso, gambe a volume di mantenimento",
    blocco: {numero: 7, settimane: 6, inizio: oggiISO(), sedutePerSettimana: 4},
    giorni: [
      g("1° giorno", "Full body", "addome", [
        e({nome:"Stacco rumeno", gruppo:"gambe", att:5, serie:3, repMin:6, repMax:8, repsTxt:"8-6", incremento:5}),
        e({nome:"Panca 30° multipower", gruppo:"petto", att:5, serie:3, repMin:6, repMax:8, repsTxt:"8-6", incremento:2.5}),
        e({nome:"Lat machine presa prona", gruppo:"dorso", att:5, serie:3, repMin:6, repMax:8, repsTxt:"8-6", incremento:2.5}),
        e({nome:"Alzate laterali cavo basso avanti", gruppo:"spalle", serie:4, repMin:8, repMax:10, repsTxt:"8-10", incremento:1.25, superset:true}),
        e({nome:"Leg extension", gruppo:"gambe", serie:4, repMin:8, repMax:10, repsTxt:"8-10", incremento:2.5}),
        e({nome:"Panca Scott macchina", gruppo:"braccia", serie:4, repMin:6, repMax:8, repsTxt:"8-6", incremento:1.25, superset:true}),
        e({nome:"Pusshdown con voulchen su panca 30°", gruppo:"braccia", serie:4, repMin:6, repMax:8, repsTxt:"8-6", incremento:1.25, nota:"sdraiato su panca, spalle al cavo"}),
      ]),
      g("2° giorno", "Full body", "polpacci", [
        e({nome:"Piegamenti zavorrati", gruppo:"petto", serie:4, repMin:10, repMax:10, repsTxt:"10", incremento:2.5, tecnica:"rest-pause ×2"}),
        e({nome:"Pulley", gruppo:"dorso", serie:4, repMin:10, repMax:10, repsTxt:"10", incremento:2.5, tecnica:"rest-pause ×2"}),

async function avviaSync(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  let d = null;
  try { d = await window.claude.use("db"); } catch (e) {}
  if (!d) return;
  db = d;
  try {
    const doc = await db.doc("stato/corrente").get();
    const remoto = doc.exists ? doc.data() : null;
    if (remoto && remoto.scheda && Number(remoto.rev) >= REV){
      stato.scheda = sistemaRecuperi(remoto.scheda);
      stato.questionario = remoto.questionario || {};
      stato.pesi = remoto.pesi || [];

      await db.doc("stato/corrente").set({rev: REV, scheda: stato.scheda, questionario: stato.questionario, pesi: stato.pesi, agg: new Date().toISOString()});
    }
    const snap = await db.collection("sessioni").orderBy("data").limit(900).get();
    const remote = snap.docs.map(x => x.data()).filter(Boolean);
    const mappa = new Map(remote.map(s => [s.id, s]));
    stato.sessioni.forEach(s => { if (!mappa.has(s.id)){ mappa.set(s.id, s); db.doc("sessioni/" + s.id).set(s).catch(() => {}); } });

/* ============ calcoli ============ */
function tuttiGliEsercizi(){
  const out = [];
  stato.scheda.giorni.forEach(g => g.esercizi.forEach(e => out.push({e, g})));
  return out;
}
function storicoDi(nome){
  const k = chiave(nome);
  return stato.sessioni
    .map(s => {
      const e = s.esercizi.find(x => chiave(x.nome) === k);
      if (!e) return null;
      const sets = e.sets.filter(x => Number(x.kg) > 0 && Number(x.reps) > 0);
      if (!sets.length) return null;
      const lavoro = sets.filter(x => !x.att);
      const migliore = sets.reduce((a, b) => e1rm(b.kg, b.reps) > e1rm(a.kg, a.reps) ? b : a);
      return {
        data: s.data, giornoNome: s.giornoNome, sets, lavoro,
        kgMax: Math.max.apply(null, sets.map(x => x.kg)),
        volume: sets.reduce((t, x) => t + x.kg * x.reps, 0),
        e1rm: e1rm(migliore.kg, migliore.reps),
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.data.localeCompare(b.data));
}

function obiettivo(es){
  const storia = storicoDi(es.nome);
  const ultima = storia[storia.length - 1];
  // l'obiettivo si calcola sull'ultima seduta che ha serie di lavoro: una seduta con la sola serie iniziale non conta
  const conLavoro = storia.filter(x => x.lavoro.length);
  const rif = conLavoro[conLavoro.length - 1];
  if (!rif) return {kg: 0, reps: es.repMin, ultima: ultima || null,
    motivo: (ultima ? "Nessuna serie di lavoro registrata finora" : "Prima volta") + ": parti con un carico che ti lascia 1-2 ripetizioni di margine e annotalo."};
  const sets = rif.lavoro;
  const kg = sets.reduce((a, b) => a.kg >= b.kg ? a : b).kg;
  const alCarico = sets.filter(s => s.kg >= kg);
  if (alCarico.length >= es.serie && alCarico.every(s => s.reps >= es.repMax)){
    return {kg: arrotonda(kg + es.incremento, es.incremento), reps: es.repMin,
      motivo: "Tutte le serie chiuse a " + es.repMax + ": sali di " + num(es.incremento, 2) + " kg e riparti da " + es.repMin + ".", ultima};
  }
  const minReps = Math.min.apply(null, alCarico.map(s => s.reps));
  if (minReps >= es.repMin && es.repMax > es.repMin){
    return {kg, reps: Math.min(es.repMax, minReps + 1), motivo: "Stesso carico: guadagna una ripetizione per serie fino a " + es.repMax + ".", ultima};
  }
  if (minReps >= es.repMax) return {kg: arrotonda(kg + es.incremento, es.incremento), reps: es.repMax, motivo: "Serie piene: prova " + num(es.incremento, 2) + " kg in più.", ultima};
  return {kg, reps: es.repMin, motivo: "Consolida questo carico prima di salire.", ultima};
}

function prescrizione(e){
  const reps = e.repsTxt || (e.repMin === e.repMax ? String(e.repMax) : e.repMin + "-" + e.repMax);
  return (e.att ? "1×" + e.att + " + " : "") + e.serie + "×" + reps;
}
// ["100×5", "80×8·7·6"]: ogni serie col suo carico, unendo quelle consecutive allo stesso peso.
// La serie iniziale (att) resta sempre un gruppo a sé, anche se ha lo stesso carico delle altre.
function serieGruppi(sets){
  const gruppi = [];
  sets.forEach(s => {
    const u = gruppi[gruppi.length - 1];
    if (u && u.kg === s.kg && u.att === !!s.att) u.reps.push(s.reps);
    else gruppi.push({kg: s.kg, att: !!s.att, reps: [s.reps]});
  });
  return gruppi.map(g => num(g.kg, 2) + "×" + g.reps.join("·"));
}
function riassuntoUltima(u){
  if (!u) return "Nessuno storico";
  return "Ultima " + dataBreve(u.data) + ": " + serieGruppi(u.sets).join(" · ");
}

/* --- blocco --- */
function blocco(){
  const b = stato.scheda.blocco || (stato.scheda.blocco = {numero: 1, settimane: 6, inizio: oggiISO(), sedutePerSettimana: 4});
  const fine = piuGiorni(b.inizio, b.settimane * 7 - 1);
  const gg = giorniTra(b.inizio, oggiISO());
  const settimana = Math.min(b.settimane, Math.max(1, Math.floor(gg / 7) + 1));
  const sedute = stato.sessioni.filter(s => s.data >= b.inizio && s.data <= fine);
  const attese = Math.min(b.settimane, Math.max(1, settimana)) * (b.sedutePerSettimana || 4);
  return {...b, fine, settimana, gg, sedute, attese, totali: b.settimane * (b.sedutePerSettimana || 4),
    finito: gg >= b.settimane * 7, aderenza: attese ? Math.min(100, Math.round(sedute.length / attese * 100)) : 0};
}
function progressioniBlocco(){
  const b = blocco();
  const visti = new Set();
  const out = [];
  tuttiGliEsercizi().forEach(({e}) => {
    const k = chiave(e.nome);
    if (visti.has(k)) return;
    visti.add(k);
    const storia = storicoDi(e.nome).filter(x => x.data >= b.inizio);
    if (storia.length < 2) return;
    const a = storia[0], z = storia[storia.length - 1];
    out.push({nome: e.nome, gruppo: e.gruppo, sedute: storia.length, da: a.e1rm, a: z.e1rm, delta: z.e1rm - a.e1rm,
      kgDa: a.kgMax, kgA: z.kgMax, deltaKg: z.kgMax - a.kgMax, serieDa: serieGruppi(a.sets).join(" · "), serieA: serieGruppi(z.sets).join(" · "), pct: a.e1rm ? (z.e1rm - a.e1rm) / a.e1rm * 100 : 0});
  });
  return out.sort((x, y) => y.pct - x.pct);
}
function sedutaPiuPesante(){
  const b = blocco();
  const per = new Map();
  b.sedute.forEach(s => {
    const vol = s.esercizi.reduce((t, e) => t + e.sets.reduce((v, x) => v + x.kg * x.reps, 0), 0);
    const c = per.get(s.giornoNome) || {n: 0, vol: 0, serie: 0};
    c.n++; c.vol += vol; c.serie += s.esercizi.reduce((t, e) => t + e.sets.length, 0);
    per.set(s.giornoNome, c);
  });
  let top = null;
  per.forEach((v, k) => { const m = v.vol / v.n; if (!top || m > top.media) top = {nome: k, media: m, serie: Math.round(v.serie / v.n)}; });
  return top;
}
function pesoBlocco(){
  const b = blocco();
  const voci = stato.pesi.slice().sort((a, z) => a.data.localeCompare(z.data));
  const dentro = voci.filter(v => v.data >= b.inizio);
  if (!voci.length) return null;
  const primo = dentro[0] || voci[voci.length - 1];
  const ultimo = voci[voci.length - 1];
  return {primo, ultimo, delta: ultimo.kg - primo.kg, voci};
}
function settimanaCorrente(){
  const d = new Date(); d.setHours(12,0,0,0);
  const lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const iso = isoData(lun);
  const ses = stato.sessioni.filter(s => s.data >= iso);
  return {
    n: ses.length,
    serie: ses.reduce((t, s) => t + s.esercizi.reduce((v, e) => v + e.sets.length, 0), 0),
    volume: ses.reduce((t, s) => t + s.esercizi.reduce((v, e) => v + e.sets.reduce((x, y) => x + y.kg * y.reps, 0), 0), 0),
  };
}
function giornoSuggerito(){
  const g = stato.scheda.giorni;
  if (!g.length) return null;
  const ultima = stato.sessioni[stato.sessioni.length - 1];
  if (!ultima) return g[0];
  const i = g.findIndex(x => x.id === ultima.giornoId);
  if (i < 0) return g[0];
  return g[(i + 1) % g.length];
}

/* ============ bozza ============ */
function creaBozza(giornoId){
  const g = stato.scheda.giorni.find(x => x.id === giornoId);
  if (!g) return null;
  const sets = {};
  g.esercizi.forEach(e => {
    const o = obiettivo(e);
    const righe = [];
    // la serie iniziale ha un carico suo: riparte da quello dell'ultima volta che l'hai fatta, non da quello delle serie di lavoro
    const attUltima = e.att ? storicoDi(e.nome).map(x => x.sets.find(y => y.att)).filter(Boolean).pop() : null;
    if (e.att) righe.push({kg: attUltima ? attUltima.kg : "", reps: e.att, done: false, att: true});
    for (let i = 0; i < e.serie; i++) righe.push({kg: o.kg || "", reps: o.reps || "", done: false});
    sets[e.id] = righe;
  });
  return {giornoId, data: oggiISO(), sets, note: ""};
}
// Dopo una modifica alla scheda: se non c'è niente di spuntato la bozza si rifà da capo. A metà allenamento
// restano le righe già scritte, si aggiungono quelle degli esercizi nuovi e si tolgono quelle degli esercizi eliminati.
function aggiornaBozza(){
  if (!stato.bozza) return;
  const g = stato.scheda.giorni.find(x => x.id === stato.bozza.giornoId);
  if (!g){ stato.bozza = null; return; }
  if (!contaFatte()){ stato.bozza = creaBozza(g.id); return; }
  const nuova = creaBozza(g.id);
  Object.keys(stato.bozza.sets).forEach(k => { if (!nuova.sets[k]) delete stato.bozza.sets[k]; });
  g.esercizi.forEach(e => { if (!stato.bozza.sets[e.id]) stato.bozza.sets[e.id] = nuova.sets[e.id]; });
}
function contaFatte(){
  if (!stato.bozza) return 0;
  return Object.keys(stato.bozza.sets).reduce((t, k) => t + stato.bozza.sets[k].filter(r => r.done).length, 0);
}

/* ============ render ============ */
function render(){
  const b = blocco();
  $$(".tab").forEach(t => {
    t.setAttribute("aria-selected", String(t.dataset.vista === stato.vista));
    const p = t.querySelector(".pallino");
    if (t.dataset.vista === "report" && b.finito && !p) t.insertAdjacentHTML("beforeend", '<span class="pallino"></span>');
  });

  else if (stato.vista === "progressi") vistaProgressi();
  else vistaReport();
  window.scrollTo({top: 0});
}

    '<div class="tiny muted mono">' + dataIT(b.inizio).slice(0,5) + ' → ' + dataIT(b.fine).slice(0,5) + '</div></div>' +
    '<div class="sett">' + sett.join("") + '</div>' +
    '<div class="small muted">' + (b.finito
      ? '<b>Blocco concluso.</b> Compila il questionario nella scheda Report e mandalo al coach.'
      : 'Settimana <b>' + b.settimana + '</b> di ' + b.settimane + ' · <b class="mono">' + b.sedute.length + '</b> ' + (b.sedute.length === 1 ? "seduta registrata" : "sedute registrate") + ' su ' + b.attese + ' previste finora') +

      html += '<div class="sezione"><span class="eyebrow">Post allenamento · ' + (g.post === "addome" ? "addome" : "polpacci") + '</span></div>';
    }
    const o = obiettivo(e);
    const and = andamento(storicoDi(e.nome));
    const gr = gruppo(e.gruppo);
    const righe = stato.bozza.sets[e.id] || [];
    const prossimo = g.esercizi[i + 1];
    html += '<section class="es' + (e.superset ? " ss" : "") + '" data-es="' + e.id + '">' +
      '<div class="es-head">' +

          (e.tecnica ? '<span class="tec">ultima: ' + esc(e.tecnica) + '</span>' : "") +
          (e.superset && prossimo ? '<span class="tec">superserie ↓ ' + esc(prossimo.nome) + '</span>' : "") +
          '<span>' + (e.superset && prossimo ? "senza pausa" : (e.recupero ? "rec " + mmss(e.recupero) : "nessun recupero")) + '</span>' +
        '</div>' +
        (e.nota ? '<div class="nota-es">' + esc(e.nota) + '</div>' : "") +
        (o.ultima
          ? '<button class="storico-btn" data-storico="' + esc(e.nome) + '" aria-label="Storico di ' + esc(e.nome) + '">' +
              '<span class="testo">' + esc(riassuntoUltima(o.ultima)) + '</span>' +
              (and ? '<span class="delta" data-dir="' + and.dir + '">' + and.testo + '</span>' : "") +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'
          : '<div class="small muted">Nessuno storico</div>') +
        '<span class="obiettivo">Obiettivo <span class="mono">' + (o.kg ? num(o.kg, 2) + " kg × " + o.reps : "da impostare") + '</span></span>' +
        '<span class="motivo">' + esc(o.motivo) + '</span>' +
      '</div>' +
      '<div class="serie" data-serie="' + e.id + '">' + righe.map((r, j) => rigaHTML(e.id, j, r)).join("") + '</div>' +

      (righe.length > 1 ? '<button class="btn sm ghost" data-meno="' + e.id + '">− serie</button>' : "") + '</div>' +
    '</section>';
  });

  html += '<label class="f" style="gap:6px"><span class="eyebrow">Come è andata</span>' +
    '<textarea class="note-box" id="note-seduta" placeholder="Fastidi, sensazioni, cose da dire al coach…">' + esc(stato.bozza.note || "") + '</textarea></label>';

  const n = contaFatte();
  html += '<div class="salva-bar"><button class="btn primary block" id="salva" ' + (n ? "" : "disabled") + '>' +
    (n ? "Salva allenamento · " + n + " serie" : "Spunta le serie che hai fatto") + '</button></div></div>';
  app.innerHTML = html;
}

function rigaHTML(esId, j, r){
  return '<div class="sr" data-riga="' + j + '" data-es="' + esId + '" data-done="' + (r.done ? 1 : 0) + '" data-att="' + (r.att ? 1 : 0) + '">' +
    '<div class="sr-n">' + (r.att ? "att" : j + (stato.bozza.sets[esId][0] && stato.bozza.sets[esId][0].att ? 0 : 1)) + '</div>' +
    '<div class="fld"><input type="number" inputmode="decimal" step="0.5" min="0" max="999" value="' + (r.kg === "" ? "" : r.kg) + '" data-campo="kg" aria-label="Carico"><u>kg</u></div>' +
    '<div class="fld"><input type="number" inputmode="numeric" step="1" min="0" max="99" value="' + (r.reps === "" ? "" : r.reps) + '" data-campo="reps" aria-label="Ripetizioni"><u>rip</u></div>' +
    '<button class="tick" data-tick aria-label="Serie completata" aria-pressed="' + (r.done ? "true" : "false") + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' +
    '</button></div>';
}
function aggiornaSalva(){
  const b = $("#salva");
  if (!b) return;
  const n = contaFatte();
  b.disabled = !n;
  b.textContent = n ? "Salva allenamento · " + n + " serie" : "Spunta le serie che hai fatto";
}
function salvaAllenamento(){
  const b = stato.bozza;
  const g = stato.scheda.giorni.find(x => x.id === b.giornoId);
  const esercizi = [];
  g.esercizi.forEach(e => {
    const sets = (b.sets[e.id] || []).filter(r => r.done && Number(r.reps) > 0)
      .map(r => { const o = {kg: Number(r.kg) || 0, reps: Number(r.reps)}; if (r.att) o.att = true; return o; });
    if (sets.length) esercizi.push({esId: e.id, nome: e.nome, gruppo: e.gruppo, sets});
  });
  if (!esercizi.length) return;
  const nuova = {id: uid(), data: b.data, giornoId: g.id, giornoNome: g.nome, note: (b.note || "").trim(), esercizi};
  stato.sessioni = stato.sessioni.concat([nuova]).sort((a, z) => a.data.localeCompare(z.data));
  stato.bozza = creaBozza(g.id);
  salvaSessione(nuova);
  fermaTimer();
  render();
  toast("Salvato: " + esercizi.reduce((t, e) => t + e.sets.length, 0) + " serie di " + g.nome);
}

/* ---------- STORICO DI UN ESERCIZIO ---------- */
// Sto progredendo? Massimale stimato dell'ultima seduta contro quello di tre sedute prima (meno, se non ce ne sono).
function andamento(storia){
  if (storia.length < 2) return null;
  const ultime = storia.slice(-4);
  const a = ultime[0].e1rm, z = ultime[ultime.length - 1].e1rm;
  const pct = a ? (z - a) / a * 100 : 0;
  const dir = Math.abs(pct) < 1 ? "fermo" : (pct > 0 ? "su" : "giu");
  return {dir, n: ultime.length, testo: dir === "fermo" ? "= stabile" : (dir === "su" ? "▲ +" : "▼ −") + num(Math.abs(pct), 1) + "%"};
}
function apriStorico(nome){
  const storia = storicoDi(nome);
  if (!storia.length) return;
  const d = $("#dlg-storico");
  const and = andamento(storia);
  const rec = storia.reduce((a, b) => b.e1rm > a.e1rm ? b : a);
  $("#st-titolo").textContent = nome;
  let html = '<div class="tiles">' +
    tile("Andamento", and ? '<span class="delta" data-dir="' + and.dir + '">' + and.testo + '</span>' : "—", "",
      and ? "massimale stimato, ultime " + and.n + " sedute" : "serve un'altra seduta per dirlo", "fermo") +
    tile("Record", num(rec.e1rm, 1), "kg", "massimale stimato · " + dataBreve(rec.data), "fermo") + '</div>';
  if (storia.length >= 2) html += '<div class="chart-box">' + grafico(storia.slice(-12), Math.min(760, window.innerWidth) - 32) + '</div>';
  html += '<table class="st"><thead><tr><th>Data</th><th>Serie (kg×rip)</th><th class="num">1RM</th></tr></thead><tbody>' +
    storia.slice(-6).reverse().map(x =>
      '<tr><td class="mono" style="font-size:12px">' + esc(dataBreve(x.data)) + '</td>' +
      '<td class="mono" style="font-size:13px">' + serieGruppi(x.sets).map(g => '<span style="white-space:nowrap">' + g + '</span>').join(" · ") + '</td>' +
      '<td class="num">' + num(x.e1rm, 1) + (x === rec ? ' <span class="pr">rec</span>' : "") + '</td></tr>').join("") + '</tbody></table>';
  if (storia.length > 6) html += '<div class="tiny muted">Le ultime 6 volte su ' + storia.length + '. Le altre sono in Progressi.</div>';
  $("#st-corpo").innerHTML = html;
  d.dataset.es = chiave(nome);

function elencoEsercizi(){
  const m = new Map();
  tuttiGliEsercizi().forEach(({e}) => { if (!m.has(chiave(e.nome))) m.set(chiave(e.nome), e.nome); });
  stato.sessioni.forEach(s => s.esercizi.forEach(e => { if (!m.has(chiave(e.nome))) m.set(chiave(e.nome), e.nome); }));
  return Array.from(m, ([k, nome]) => ({k, nome}));
}

      '<div class="chart-box">' + grafico(storia, app.clientWidth - 50) + '</div></div>';
    html += '<div class="card" style="overflow-x:auto"><table class="st"><thead><tr><th>Data</th><th>Serie (kg×rip)</th><th class="num">1RM</th><th class="num">Volume</th></tr></thead><tbody>' +
      storia.slice().reverse().slice(0, 14).map(x =>

        '<td class="mono" style="font-size:12px">' + serieGruppi(x.sets).map(g => '<span style="white-space:nowrap">' + g + '</span>').join(" · ") + '</td>' +
        '<td class="num">' + num(x.e1rm, 1) + (Math.abs(x.e1rm - record1rm) < 0.05 ? ' <span class="pr">rec</span>' : "") + '</td>' +
        '<td class="num">' + num(x.volume / 1000, 2) + ' t</td></tr>').join("") + '</tbody></table></div>';

function tile(k, v, u, d, dir){
  return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + ' <small>' + u + '</small></div><div class="d" data-dir="' + dir + '">' + esc(d) + '</div></div>';
}

function passoBello(g){
  const p = Math.pow(10, Math.floor(Math.log10(g)));
  const r = g / p;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p;
}
// larg = larghezza in px dello spazio disponibile: il grafico si disegna a quella misura, così i numeri restano leggibili
function grafico(storia, larg){
  const W = Math.round(Math.max(250, Math.min(680, larg || 680))), H = W < 420 ? 210 : 250, pl = 48, pr = 22, pt = 26, pb = 32;
  const iw = W - pl - pr, ih = H - pt - pb;
  if (storia.length < 2){
    return '<p class="small muted" style="margin:0;padding:26px 14px;text-align:center">Servono almeno due sedute per disegnare la progressione.</p>';
  }
  const vals = storia.map(x => x.e1rm);
  const vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
  const passo = passoBello(Math.max((vmax - vmin) / 3.2, vmax * 0.02, 0.5));
  const lo = Math.max(0, Math.floor((vmin - passo * 0.7) / passo) * passo);
  const hi = Math.ceil((vmax + passo * 0.7) / passo) * passo;
  const ty = v => pt + ih - ((v - lo) / (hi - lo || 1)) * ih;
  const t0 = new Date(storia[0].data + "T12:00:00").getTime();
  const t1 = new Date(storia[storia.length - 1].data + "T12:00:00").getTime();
  const tx = iso => t1 === t0 ? pl + iw / 2 : pl + ((new Date(iso + "T12:00:00").getTime() - t0) / (t1 - t0)) * iw;

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento del massimale stimato">';
  for (let v = lo; v <= hi + 1e-6; v += passo){
    const y = ty(v);
    s += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pl - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink-3)">' + num(v, 1) + '</text>';
  }
  const volMax = Math.max.apply(null, storia.map(x => x.volume)) || 1;
  const bw = Math.max(5, Math.min(22, iw / storia.length * 0.45));
  storia.forEach(x => {
    const h = (x.volume / volMax) * ih * 0.42;
    s += '<rect x="' + (tx(x.data) - bw / 2).toFixed(1) + '" y="' + (pt + ih - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--vol)" rx="2"/>';
  });
  const pts = storia.map(x => [tx(x.data), ty(x.e1rm)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  s += '<path d="' + d + ' L' + pts[pts.length-1][0].toFixed(1) + ' ' + (pt + ih) + ' L' + pts[0][0].toFixed(1) + ' ' + (pt + ih) + ' Z" fill="var(--accent-soft)"/>';
  s += '<path d="' + d + '" fill="none" stroke="var(--dato)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => { if (i < pts.length - 1) s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--surface)" stroke="var(--dato)" stroke-width="1.8"/>'; });
  const last = pts[pts.length - 1];
  s += '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="5.5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"/>';
  const ly = last[1] < pt + 16 ? last[1] + 19 : last[1] - 12;
  s += '<text x="' + (W - pr) + '" y="' + ly.toFixed(1) + '" text-anchor="end" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="13" fill="var(--ink)">' + num(vals[vals.length-1], 1) + ' kg</text>';
  const idx = storia.length > 3 ? [0, Math.floor(storia.length / 2), storia.length - 1] : [0, storia.length - 1];
  idx.forEach((i, k) => {
    const anchor = k === 0 ? "start" : (k === idx.length - 1 ? "end" : "middle");
    const x = k === 0 ? pl : (k === idx.length - 1 ? W - pr : tx(storia[i].data));
    s += '<text x="' + x.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="' + anchor + '" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--ink-3)">' + dataBreve(storia[i].data) + '</text>';
  });
  return s + '<line x1="' + pl + '" y1="' + (pt + ih) + '" x2="' + (W - pr) + '" y2="' + (pt + ih) + '" stroke="var(--line-2)" stroke-width="1"/></svg>';
}

/* ---------- REPORT ---------- */
function suggerimento(tipo){
  const prog = progressioniBlocco();
  const b = blocco();
  if (tipo === "meglio"){
    const top = prog.filter(p => p.delta > 0.2).slice(0, 4);
    if (!top.length) return null;
    return top.map(p => p.nome + " " + num(p.kgDa, 2) + "→" + num(p.kgA, 2) + " kg (" + segno(p.delta) + " di 1RM)").join("; ");
  }
  if (tipo === "peggio"){
    const bot = prog.filter(p => p.delta <= 0.5).slice(-4).reverse();
    if (!bot.length) return null;
    return bot.map(p => p.nome + " (" + (Math.abs(p.delta) < 0.2 ? "fermo" : segno(p.delta) + " kg") + ")").join("; ");
  }
  if (tipo === "calo"){
    const giu = prog.filter(p => p.delta < -0.3);
    if (!giu.length) return "Dai dati non risulta nessun esercizio in calo di carico in questo blocco.";
    return giu.map(p => p.nome + " " + segno(p.delta) + " kg di 1RM").join("; ");
  }
  if (tipo === "seduta"){
    const t = sedutaPiuPesante();
    if (!t) return null;
    return "La seduta con più volume medio è stata " + t.nome + " (circa " + num(t.media / 1000, 1) + " t e " + t.serie + " serie a sessione).";
  }
  if (tipo === "peso"){
    const p = pesoBlocco();
    if (!p) return "Registra il peso corporeo qui sopra per avere il confronto automatico.";
    return "Peso attuale " + num(p.ultimo.kg, 1) + " kg, " + (Math.abs(p.delta) < 0.2 ? "stabile" : segno(p.delta) + " kg") + " rispetto a " + num(p.primo.kg, 1) + " kg del " + dataBreve(p.primo.data) + ".";
  }
  if (tipo === "aderenza"){
    return "Hai registrato " + nSedute(b.sedute.length) + " su " + b.totali + " previste nel blocco (" + Math.round(b.sedute.length / b.totali * 100) + "%).";
  }
  if (tipo === "note"){
    const note = b.sedute.filter(s => s.note).map(s => dataBreve(s.data) + " " + s.giornoNome + ": " + s.note);
    return note.length ? note.join(" · ") : null;
  }
  return null;
}

function testoQuestionario(){
  const b = blocco();
  const prog = progressioniBlocco();
  const peso = pesoBlocco();
  const L = [];
  L.push("QUESTIONARIO DI FINE PROGRAMMA");
  L.push(stato.scheda.nome + " — " + b.numero + "° blocco");
  if (stato.scheda.sottotitolo) L.push(stato.scheda.sottotitolo);
  L.push("Periodo: " + dataIT(b.inizio) + " - " + dataIT(b.fine) + " (" + b.settimane + " settimane)");
  L.push("Sedute registrate: " + b.sedute.length + " su " + b.totali + " previste");
  if (peso) L.push("Peso corporeo: " + num(peso.primo.kg, 1) + " kg (" + dataBreve(peso.primo.data) + ") -> " + num(peso.ultimo.kg, 1) + " kg (" + dataBreve(peso.ultimo.data) + "), " + (Math.abs(peso.delta) < 0.2 ? "stabile" : segno(peso.delta) + " kg"));
  L.push("");
  DOMANDE.forEach(d => {
    const v = stato.questionario[d.n];
    L.push(d.n + ") " + d.q.toUpperCase());
    if (d.tipo === "scala") L.push("   " + (v == null ? "-" : v + "/10") + (v == null ? "" : "  (1 " + d.lo + " - 10 " + d.hi + ")"));
    else L.push("   " + (v ? String(v).replace(/\n/g, "\n   ") : "-"));
    L.push("");
  });
  if (prog.length){
    L.push("--- PROGRESSIONI DI CARICO DEL BLOCCO (kg x ripetizioni di ogni serie: prima -> ultima seduta; massimale stimato) ---");
    prog.forEach(p => {
      L.push("  " + p.nome + ": " + p.serieDa + "  ->  " + p.serieA + "   1RM " + num(p.da, 1) + " -> " + num(p.a, 1) + " (" + segno(p.delta) + " kg, " + segno(p.pct) + "%)  su " + p.sedute + " sedute");
    });
    L.push("");
  }
  const note = b.sedute.filter(s => s.note);
  if (note.length){
    L.push("--- NOTE DELLE SEDUTE ---");
    note.forEach(s => L.push("  " + dataBreve(s.data) + " " + s.giornoNome + ": " + s.note));
    L.push("");
  }
  L.push("--- SEDUTE DEL BLOCCO ---");
  b.sedute.forEach(s => {
    const serie = s.esercizi.reduce((t, e) => t + e.sets.length, 0);
    const vol = s.esercizi.reduce((t, e) => t + e.sets.reduce((v, x) => v + x.kg * x.reps, 0), 0);
    L.push("  " + dataIT(s.data) + "  " + s.giornoNome + " - " + serie + " serie, " + num(vol / 1000, 2) + " t");
  });
  return L.join("\n");
}

/* ============ timer ============ */
/* Il conto alla rovescia segue l'ora vera di fine, così resta giusto anche se il telefono rallenta la pagina.
   Finito il tempo la sveglia suona a ripetizione finché non la fermi (al massimo un minuto).
   Un'app web non può suonare a schermo spento né, su iPhone, vibrare: per questo durante il recupero
   lo schermo viene tenuto acceso (dove il telefono lo permette). */
let timer = null;
let audio = null;    // AudioContext: i browser lo lasciano suonare solo se nasce da un tocco
let veglia = null;   // blocco che tiene acceso lo schermo
const CHIAVE_SVEGLIA = "diario-ghisa-sveglia";
const CHIAVE_TIMER = "diario-ghisa-timer";
// "forte": suona anche col tasto silenzioso ma mette in pausa la musica; "discreta": si mescola alla musica, tace col silenzioso
function svegliaForte(){ try { return localStorage.getItem(CHIAVE_SVEGLIA) !== "discreta"; } catch (e) { return true; } }
function sbloccaSuono(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio){
      audio = new Ctx();
      // un campione muto suonato dentro il tocco: senza, su iPhone l'audio resta bloccato
      const b = audio.createBufferSource();
      b.buffer = audio.createBuffer(1, 1, 22050);
      b.connect(audio.destination); b.start(0);
    }
    if (audio.state !== "running") audio.resume().catch(() => {});
  } catch (e) {}
}
async function tieniSveglio(si){
  try {
    if (!si){
      if (veglia){ const v = veglia; veglia = null; await v.release(); }
      return;
    }
    if (veglia || !navigator.wakeLock || document.visibilityState !== "visible") return;
    const v = await navigator.wakeLock.request("screen");
    if (!timer || veglia){ v.release().catch(() => {}); return; }
    veglia = v;
    v.addEventListener("release", () => { if (veglia === v) veglia = null; });
  } catch (e) { veglia = null; }
}
function avviaTimer(sec, etichetta, ripresa){
  fermaTimer();
  if (!sec) return;
  const el = document.createElement("div");
  el.className = "timer";
  el.setAttribute("role", "timer");
  el.innerHTML = '<span class="t">0:00</span><span class="lbl">' + esc(etichetta || "recupero") + '</span>' +
    '<button data-piu30>+30s</button><button data-stop>Salta</button><span class="prog" style="width:100%"></span>';
  document.body.appendChild(el);
  // Salva e il fondo della pagina stanno sopra il timer: la sua altezza va tenuta aggiornata (etichette lunghe, schermo ruotato)
  const misura = () => document.documentElement.style.setProperty("--timer-h", (el.offsetHeight + 8) + "px");
  misura();
  const oss = window.ResizeObserver ? new ResizeObserver(misura) : null;
  if (oss) oss.observe(el);
  let tot = ripresa ? ripresa.tot : sec, fine = ripresa ? ripresa.fine : Date.now() + sec * 1000;
  const ricorda = () => { try { localStorage.setItem(CHIAVE_TIMER, JSON.stringify({fine, tot, etichetta: etichetta || ""})); } catch (e) {} };
  ricorda();
  const tick = () => {
    if (!timer || timer.suona) return;
    const resta = Math.max(0, Math.ceil((fine - Date.now()) / 1000));
    el.querySelector(".t").textContent = mmss(resta);
    el.querySelector(".prog").style.width = Math.min(100, resta / tot * 100) + "%";
    if (resta <= 0) sveglia();
  };
  timer = {el, oss, suona: false, id: setInterval(tick, 250), tick, piu(){ tot += 30; fine += 30000; ricorda(); tick(); }};
  tick();
  tieniSveglio(true);
}
function sveglia(){
  if (!timer || timer.suona) return;
  timer.suona = true;
  clearInterval(timer.id);
  const pannello = $("#dlg-storico");
  if (pannello && pannello.open) pannello.close();
  const el = timer.el;
  el.classList.add("suona");
  el.querySelector(".t").textContent = "0:00";
  el.querySelector(".lbl").textContent = "Tempo! Riparti";
  el.querySelector(".prog").style.width = "0%";
  const piu = el.querySelector("[data-piu30]");
  if (piu) piu.remove();
  el.querySelector("[data-stop]").textContent = "Stop";
  try { if (navigator.audioSession) navigator.audioSession.type = svegliaForte() ? "playback" : "transient"; } catch (e) {}
  let giri = 0;
  // gli squilli si contano solo con l'app a schermo: se la lasci in secondo piano, al rientro sta ancora suonando
  const giro = () => { if (document.visibilityState !== "visible") return; if (++giri > 40){ fermaTimer(); return; } squilla(); };
  giro();
  timer.id = setInterval(giro, 1500);
}
function fermaTimer(){
  if (!timer) return;
  const era = timer;
  timer = null;
  try { localStorage.removeItem(CHIAVE_TIMER); } catch (e) {}
  clearInterval(era.id);
  if (era.oss) era.oss.disconnect();
  era.el.remove();
  document.documentElement.style.removeProperty("--timer-h");
  if (era.suona){
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
    try { if (navigator.audioSession) navigator.audioSession.type = "auto"; } catch (e) {}
  }
  tieniSveglio(false);
}
// uno squillo: tre bip acuti e, dove il telefono lo permette, tre vibrazioni
function squilla(){
  try { if (navigator.vibrate) navigator.vibrate([260, 120, 260, 120, 260]); } catch (e) {}
  try {
    if (!audio) return;
    if (audio.state !== "running") audio.resume().catch(() => {});
    const t0 = audio.currentTime + 0.03;
    for (let i = 0; i < 3; i++){
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.24;
      o.type = "square"; o.frequency.value = 1976;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
      g.gain.setValueAtTime(0.3, t + 0.13);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.18);
    }
  } catch (e) {}
}
function riprendiTimer(){
  try {
    const t = JSON.parse(localStorage.getItem(CHIAVE_TIMER) || "null") || {};
    const fine = Number(t.fine), tot = Number(t.tot);
    const resta = fine ? Math.ceil((fine - Date.now()) / 1000) : 0;
    if (resta > 0 && resta <= 3600 && tot > 0) avviaTimer(resta, String(t.etichetta || ""), {fine, tot});
    else localStorage.removeItem(CHIAVE_TIMER);
  } catch (e) { try { localStorage.removeItem(CHIAVE_TIMER); } catch (e2) {} }
}
// dopo un ricaricamento il suono va sbloccato di nuovo: basta un tocco qualsiasi mentre il timer corre
["pointerup", "click"].forEach(ev => document.addEventListener(ev, () => { if (timer) sbloccaSuono(); }, {passive: true}));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !timer) return;
  timer.tick();           // rientrando nell'app il tempo si riallinea subito (e se è scaduto parte la sveglia)
  tieniSveglio(true);     // il blocco dello schermo si perde quando l'app va in secondo piano
});
let tst = null;
function toast(msg, ms){
  clearTimeout(tst);
  let el = $(".toast");
  if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg;
  tst = setTimeout(() => el.remove(), ms || 2800);
}

/* ============ dialog esercizio ============ */
const dlg = $("#dlg-es");
$("#sel-gruppo").innerHTML = GRUPPI.map(g => '<option value="' + g.id + '">' + g.nome + '</option>').join("");
let ctxEs = null;
function apriEsercizio(giornoId, esId){
  const g = stato.scheda.giorni.find(x => x.id === giornoId);
  const e = esId ? g.esercizi.find(x => x.id === esId) : null;
  ctxEs = {giornoId, esId};
  $("#dlg-es-titolo").textContent = e ? "Modifica esercizio" : "Nuovo esercizio";
  const f = $("#form-es");
  f.nome.value = e ? e.nome : "";
  f.gruppo.value = e ? e.gruppo : "petto";
  f.att.value = e ? (e.att || 0) : 0;
  f.serie.value = e ? e.serie : 4;
  f.repMin.value = e ? e.repMin : 8;
  f.repMax.value = e ? e.repMax : 10;
  f.recupero.value = e ? e.recupero : 90;
  f.incremento.value = e ? String(e.incremento) : "2.5";
  f.tecnica.value = e ? (e.tecnica || "") : "";
  f.nota.value = e ? (e.nota || "") : "";
  f.superset.checked = !!(e && e.superset);
  dlg.showModal();
  setTimeout(() => f.nome.focus(), 30);
}
$("#form-es").addEventListener("submit", ev => {
  if (ev.submitter && ev.submitter.value === "annulla") return;
  const f = ev.target;
  const dati = {
    nome: f.nome.value.trim() || "Esercizio",
    gruppo: f.gruppo.value,
    att: Math.max(0, Number(f.att.value) || 0),
    serie: Math.max(1, Number(f.serie.value) || 4),
    repMin: Math.max(1, Number(f.repMin.value) || 8),
    repMax: Math.max(1, Number(f.repMax.value) || 10),
    recupero: Math.max(0, Number(f.recupero.value) || 0),
    incremento: Number(f.incremento.value) || 2.5,
    tecnica: f.tecnica.value.trim(),
    nota: f.nota.value.trim(),
    superset: f.superset.checked,
  };
  if (dati.repMax < dati.repMin) dati.repMax = dati.repMin;
  const g = stato.scheda.giorni.find(x => x.id === ctxEs.giornoId);
  if (!g) return;
  const vecchio = ctxEs.esId ? g.esercizi.find(x => x.id === ctxEs.esId) : null;
  // se min e max non cambiano resta la scrittura del coach ("8-6")
  dati.repsTxt = vecchio && vecchio.repsTxt && vecchio.repMin === dati.repMin && vecchio.repMax === dati.repMax
    ? vecchio.repsTxt
    : (dati.repMin === dati.repMax ? String(dati.repMax) : dati.repMin + "-" + dati.repMax);
  // spuntare o togliere "in superserie" sistema i recuperi della coppia (solo se erano ancora quelli della regola)
  if (!ctxEs.esId || dati.superset !== !!vecchio.superset){
    const i = vecchio ? g.esercizi.indexOf(vecchio) : g.esercizi.length;
    const prima = g.esercizi[i - 1], dopo = g.esercizi[i + 1];
    if (dati.superset && dopo){
      dati.recupero = 0;
      if (!dopo.superset && dopo.recupero === 90) dopo.recupero = 150;
    } else if (vecchio && vecchio.superset && !dati.superset){
      if (!dati.recupero) dati.recupero = prima && prima.superset ? 150 : 90;
      if (dopo && !dopo.superset && dopo.recupero === 150) dopo.recupero = 90;
    }
  }
  if (vecchio) Object.assign(vecchio, dati);
  else g.esercizi.push(Object.assign({id: uid(), sezione: "main"}, dati));
  salvaTutto();
  if (stato.bozza && stato.bozza.giornoId === g.id) aggiornaBozza();
  salvaLocale();
  render();
});

/* ============ eventi ============ */
document.addEventListener("click", ev => {
  const t = ev.target;
  const tab = t.closest(".tab");
  if (tab){ stato.vista = tab.dataset.vista; render(); return; }
  const vai = t.closest("[data-vai]");
  if (vai){ stato.vista = vai.dataset.vai; render(); return; }
  const az = t.closest(".menu-pop button");
  if (az){ $("#menu").open = false; azione(az.dataset.azione); return; }
  if (!t.closest("#menu")) $("#menu").open = false;
  if (t.closest("[data-stop]")){ fermaTimer(); return; }
  const sto = t.closest("[data-storico]");
  if (sto){ apriStorico(sto.dataset.storico); return; }
  const dst = $("#dlg-storico");
  if (t.closest("[data-chiudi-storico]") || t === dst){ dst.close(); return; }
  if (t.closest("[data-storico-progressi]")){ dst.close(); stato.esSel = dst.dataset.es; stato.vista = "progressi"; render(); return; }
  if (t.closest("[data-piu30]")){ sbloccaSuono(); if (timer) timer.piu(); return; }

  const gd = t.closest("[data-giorno][aria-pressed]");
  if (gd){
    if (stato.bozza && gd.dataset.giorno === stato.bozza.giornoId) return;
    if (contaFatte() && !confirm("Cambiare giorno? Le serie spuntate e non salvate vanno perse.")) return;
    stato.bozza = creaBozza(gd.dataset.giorno); salvaLocale(); fermaTimer(); render(); return;
  }

  const tick = t.closest("[data-tick]");
  if (tick){
    const sr = tick.closest(".sr");
    const esId = sr.dataset.es, j = Number(sr.dataset.riga);
    const r = stato.bozza.sets[esId][j];
    r.done = !r.done;
    sr.dataset.done = r.done ? "1" : "0";
    tick.setAttribute("aria-pressed", String(r.done));
    if (r.done){
      sbloccaSuono();
      const info = trovaEsercizio(esId);
      if (!Number(r.reps) && info){ r.reps = info.e.repMin; sr.querySelector('[data-campo="reps"]').value = r.reps; }
      if (info && info.e.superset && info.prossimo){ fermaTimer(); toast("Superserie: vai subito a " + info.prossimo.nome, 4500); }
      else if (info) avviaTimer(info.e.recupero || (info.e.superset ? 90 : 0), (info.precedente && info.precedente.superset ? "recupero superserie · " : "recupero · ") + info.e.nome);
    }
    salvaLocale();
    aggiornaSalva();
    return;
  }
  const piu = t.closest("[data-piu]");
  if (piu){
    const esId = piu.dataset.piu;
    const righe = stato.bozza.sets[esId] || (stato.bozza.sets[esId] = []);
    const u = righe[righe.length - 1] || {kg: "", reps: ""};
    righe.push({kg: u.kg, reps: u.reps, done: false});
    $('[data-serie="' + esId + '"]').insertAdjacentHTML("beforeend", rigaHTML(esId, righe.length - 1, righe[righe.length - 1]));
    salvaLocale();
    return;
  }
  const meno = t.closest("[data-meno]");
  if (meno){
    const righe = stato.bozza.sets[meno.dataset.meno];
    if (righe.length > 1){
      if (righe[righe.length - 1].done && !confirm("Togliere l'ultima serie? L'hai già spuntata.")) return;
      righe.pop();
      $('[data-serie="' + meno.dataset.meno + '"]').lastElementChild.remove();
      salvaLocale(); aggiornaSalva();
    }
    return;
  }
  if (t.closest("#salva")){ salvaAllenamento(); return; }

  if (t.closest("#add-giorno")){
    stato.scheda.giorni.push({id: uid(), nome: (stato.scheda.giorni.length + 1) + "° giorno", tipo: "", post: "addome", esercizi: []});
    salvaTutto(); render(); return;
  }
  const addE = t.closest("[data-add-es]");
  if (addE){ apriEsercizio(addE.dataset.addEs, null); return; }

  if (t.closest("#peso-add")){
    const v = Number(String($("#peso-kg").value).replace(",", "."));
    if (!v || v < 30 || v > 250){ toast("Scrivi un peso valido, es. 78,4"); return; }
    stato.pesi = stato.pesi.filter(x => x.data !== oggiISO()).concat([{data: oggiISO(), kg: v}]).sort((a, z) => a.data.localeCompare(z.data));
    salvaTutto(); render(); toast("Peso registrato");
    return;
  }
  const usa = t.closest("[data-usa]");
  if (usa){
    const n = Number(usa.dataset.usa);
    const d = DOMANDE.find(x => x.n === n);
    const s = suggerimento(d.sugg);
    if (!s) return;
    const ta = $('textarea[data-q="' + n + '"]');
    ta.value = ta.value ? ta.value + " " + s : s;
    stato.questionario[n] = ta.value;
    salvaTutto(); toast("Risposta compilata: rileggila e correggila");
    return;
  }
  if (t.closest("#copia-q")){
    const testo = testoQuestionario();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(testo).then(() => toast("Questionario copiato: incollalo al coach"), () => toast("Non riesco a copiare"));
    else toast("Copia non disponibile qui");
    return;
  }
  if (t.closest("#scarica-q")){ scarica("questionario-" + stato.scheda.nome.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-blocco-" + blocco().numero + ".txt", testoQuestionario()); return; }

  const ico = t.closest(".icobtn[data-az]");
  if (ico){
    const a = ico.dataset.az;
    if (a === "ses-del"){
      const el = ico.closest("[data-ses]");
      if (el && confirm("Eliminare questo allenamento dallo storico?")){
        stato.sessioni = stato.sessioni.filter(s => s.id !== el.dataset.ses);
        // la bozza era precompilata con l'obiettivo calcolato anche su questa seduta: se non c'è ancora niente di spuntato la rifaccio
        if (stato.bozza && !contaFatte()){
          const note = stato.bozza.note;
          stato.bozza = creaBozza(stato.bozza.giornoId);
          if (stato.bozza) stato.bozza.note = note;
        }
        eliminaSessione(el.dataset.ses);
        render();
      }
      return;
    }
    const box = ico.closest("[data-giorno]");
    if (!box) return;
    const gi = stato.scheda.giorni.findIndex(g => g.id === box.dataset.giorno);
    const g = stato.scheda.giorni[gi];
    const riga = ico.closest(".ex-row");
    if (a === "su" || a === "giu"){
      const j = a === "su" ? gi - 1 : gi + 1;
      if (j < 0 || j >= stato.scheda.giorni.length) return;
      stato.scheda.giorni.splice(gi, 1);
      stato.scheda.giorni.splice(j, 0, g);
    } else if (a === "del-giorno"){
      if (!confirm('Eliminare "' + g.nome + '" e i suoi esercizi? Lo storico resta.')) return;
      stato.scheda.giorni.splice(gi, 1);
    } else if (riga){
      const ei = g.esercizi.findIndex(e => e.id === riga.dataset.es);
      if (a === "es-mod"){ apriEsercizio(g.id, riga.dataset.es); return; }
      if (a === "es-del"){
        if (!confirm('Eliminare "' + g.esercizi[ei].nome + '" dalla scheda? Lo storico resta.')) return;
        g.esercizi.splice(ei, 1);
      }
      if (a === "es-su" || a === "es-giu"){
        const j = a === "es-su" ? ei - 1 : ei + 1;
        if (j < 0 || j >= g.esercizi.length) return;
        const mosso = g.esercizi.splice(ei, 1)[0];
        g.esercizi.splice(j, 0, mosso);
      }
    }
    salvaTutto();
    aggiornaBozza();
    salvaLocale();
    render();
  }
});

function trovaEsercizio(id){
  for (const g of stato.scheda.giorni){
    const i = g.esercizi.findIndex(x => x.id === id);
    if (i >= 0) return {e: g.esercizi[i], g, prossimo: g.esercizi[i + 1] || null, precedente: g.esercizi[i - 1] || null};
  }
  return null;
}

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.matches('.sr input[data-campo]')){
    const sr = t.closest(".sr");
    const r = stato.bozza.sets[sr.dataset.es][Number(sr.dataset.riga)];
    r[t.dataset.campo] = t.value === "" ? "" : Number(t.value);
    salvaLocale();
    return;
  }
  if (t.id === "note-seduta"){ stato.bozza.note = t.value; salvaLocale(); return; }
  if (t.id === "nome-scheda"){ stato.scheda.nome = t.value; salvaTutto(); return; }
  if (t.matches("[data-nome-giorno]")){
    const g = stato.scheda.giorni.find(x => x.id === t.closest("[data-giorno]").dataset.giorno);
    if (g){ g.nome = t.value; salvaTutto(); }
    return;
  }
  if (t.dataset.q){
    const n = Number(t.dataset.q);
    stato.questionario[n] = t.type === "range" ? Number(t.value) : t.value;
    if (t.type === "range"){ const v = $('[data-val-di="' + n + '"]'); if (v) v.textContent = t.value; }
    salvaTutto();
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "sel-es"){ stato.esSel = t.value; vistaProgressi(); return; }
  if (["b-num","b-sett","b-freq","b-inizio"].indexOf(t.id) >= 0){
    const b = stato.scheda.blocco;
    if (t.id === "b-num") b.numero = Math.max(1, Number(t.value) || 1);
    if (t.id === "b-sett") b.settimane = Math.max(1, Number(t.value) || 6);
    if (t.id === "b-freq") b.sedutePerSettimana = Math.max(1, Number(t.value) || 4);
    if (t.id === "b-inizio" && t.value) b.inizio = t.value;
    salvaTutto(); render();
  }
});

/* ============ menu ============ */
async function scarica(nome, testo){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl){
    try { await dl.save({filename: nome, data: testo}); toast("File salvato"); return; }
    catch (err){ if (err && err.code === "declined") return; }
  }
  // fuori da claude.ai: sul telefono il foglio di condivisione ("Salva su File"), altrimenti un normale download
  try {
    const file = new File([testo], nome, {type: /\.json$/.test(nome) ? "application/json" : "text/plain"});
    if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file], title: nome});
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("File salvato");
    return;
  } catch (err){ if (err && err.name === "AbortError") return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(testo).then(() => toast("Download non disponibile: contenuto copiato negli appunti"), () => toast("Non riesco a salvare il file"));
  else toast("Download non disponibile qui");
}
function scriviVoceSveglia(){
  $("#voce-silenzioso").textContent = "Sveglia col silenzioso: " + (svegliaForte() ? "sì" : "no");
}
async function azione(a){
  if (a === "prova-sveglia"){
    if (timer && !timer.suona){ toast("C'è un recupero in corso: prova la sveglia quando è finito"); return; }
    sbloccaSuono();
    avviaTimer(3, "prova della sveglia");
    return;
  }
  if (a === "silenzioso"){
    const forte = !svegliaForte();
    try { localStorage.setItem(CHIAVE_SVEGLIA, forte ? "forte" : "discreta"); } catch (e) {}
    scriviVoceSveglia();
    toast(forte ? "La sveglia suona anche col silenzioso (mette in pausa la musica)" : "La sveglia si mescola alla musica (col silenzioso tace)", 4500);
    return;
  }
  if (a === "esporta"){
    const dati = JSON.stringify({app:"diario-di-ghisa", versione: REV, esportato: new Date().toISOString(), scheda: stato.scheda, sessioni: stato.sessioni, questionario: stato.questionario, pesi: stato.pesi}, null, 2);
    scarica("diario-di-ghisa-" + oggiISO() + ".json", dati);
    return;
  }
  if (a === "importa"){ $("#file-import").click(); return; }
  if (a === "nuovo-blocco"){
    if (!confirm("Inizi un nuovo blocco da oggi? Le sedute restano nello storico, il questionario viene svuotato.")) return;
    const b = stato.scheda.blocco;
    b.numero = (Number(b.numero) || 1) + 1;
    b.inizio = oggiISO();
    stato.questionario = {};
    salvaTutto(); render(); toast(b.numero + "° blocco iniziato oggi");
    return;
  }
  if (a === "ripristina"){
    if (!confirm("Rimettere la scheda come l'ha scritta il coach? Perdi le modifiche fatte alla scheda; storico e questionario restano.")) return;
    const vecchio = stato.scheda.blocco;
    stato.scheda = schedaCoach();
    stato.scheda.blocco = vecchio;
    stato.bozza = null;
    salvaTutto(); render(); toast("Scheda ripristinata");
    return;
  }
  if (a === "azzera"){
    if (!confirm("Cancellare scheda, storico, pesi e questionario? Non si torna indietro.")) return;
    const n = nuovoStato();
    stato.scheda = n.scheda; stato.sessioni = []; stato.bozza = null; stato.questionario = {}; stato.pesi = [];
    salvaTutto();
    if (db) db.collection("sessioni").limit(900).get().then(s => s.docs.forEach(d => db.doc("sessioni/" + d.id).delete().catch(() => {}))).catch(() => {});
    render(); toast("Azzerato");
  }
}
$("#file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(String(fr.result));
      if (!d || !d.scheda || !Array.isArray(d.sessioni)) throw new Error("formato");
      if (!confirm("Sostituire tutto con il backup del " + String(d.esportato || "").slice(0, 10) + "?")) return;
      stato.scheda = sistemaRecuperi(d.scheda);
      stato.sessioni = d.sessioni.slice().sort((a, b) => a.data.localeCompare(b.data));
      stato.questionario = d.questionario || {};
      stato.pesi = d.pesi || [];
      stato.bozza = null;
      salvaTutto();
      stato.sessioni.forEach(s => { if (db) db.doc("sessioni/" + s.id).set(s).catch(() => {}); });
      render(); toast("Backup importato");
    } catch (e){ toast("Il file non è un backup valido"); }
  };
  fr.readAsText(f);
  ev.target.value = "";
});

/* ============ avvio ============ */
const salvato = caricaLocale();
stato.scheda = sistemaRecuperi(salvato.scheda);
stato.sessioni = (salvato.sessioni || []).slice().sort((a, b) => a.data.localeCompare(b.data));
stato.questionario = salvato.questionario || {};
stato.pesi = salvato.pesi || [];
stato.bozza = salvato.bozza && salvato.bozza.data === oggiISO() ? salvato.bozza : null;
render();
scriviVoceSveglia();
riprendiTimer();
salvaLocale();
avviaSync();
})();
</script>

<script>
/* Service worker: fa partire l'app anche senza rete e avvisa quando esce una versione nuova. */
(() => {
"use strict";
if (!("serviceWorker" in navigator)) return;
let ricaricando = false;
navigator.serviceWorker.addEventListener("controllerchange", () => {
  if (ricaricando) return;
  ricaricando = true;
  location.reload();
});
window.addEventListener("load", () => {
  navigator.serviceWorker.register("sw.js").then(reg => {
    const guarda = sw => {
      if (!sw) return;
      sw.addEventListener("statechange", () => {
        if (sw.state === "installed" && navigator.serviceWorker.controller) avviso(sw);
      });
    };
    if (reg.waiting && navigator.serviceWorker.controller) avviso(reg.waiting);
    reg.addEventListener("updatefound", () => guarda(reg.installing));
    setTimeout(() => reg.update().catch(() => {}), 4000);
  }).catch(() => {});
});
function avviso(sw){
  if (document.querySelector(".aggiorna")) return;
  const el = document.createElement("div");
  el.className = "aggiorna";
  el.innerHTML = '<span>Nuova versione disponibile</span><button type="button">Aggiorna</button>';
  el.querySelector("button").addEventListener("click", () => {
    el.remove();
    sw.postMessage({tipo: "ATTIVA_SUBITO"});
  });
  document.body.appendChild(el);
}
})();
</script>
